# Diffusion stacks cameras BEFORE its backbone resize/crop.
# Preserve Cyclo's previous OpenCV uint8 linear resize as a compatibility
# default, NOT a verified training recipe. Match your dataset creation code.
# Checkpoint size specifies dimensions only, not how training resized images.
# Only additional Cyclo preprocessing is configured here; API packing stays in Python.
preprocessing:
  images:
    - resize:
        size: checkpoint
        backend: opencv
        interpolation: bilinear
