# LeRobot GR00T N1.7, not the independent groot_server Worker.
# Requires a LeRobot checkpoint and its saved pre/post processors and assets.
# This preset reproduces the verified training dataset transform: torchvision
# Resize([256, 256], antialias=True), whose default interpolation is bilinear.
# N1.7 packs views BEFORE its internal crop/resize, so unequal camera sizes must
# be aligned first. Input feature shapes may still describe the raw images;
# size: checkpoint does not reproduce this external training transform.
# This is not a universal GR00T default. Match other checkpoints to their training
# transforms; use identity if the saved processor already aligns views BEFORE
# packing. Keep the model's subsequent eval crop/resize in the saved processor.
preprocessing:
  images:
    - resize:
        size: [256, 256]
        backend: torch
        interpolation: bilinear
        antialias: true
