# cyclo_intelligence — Docker Compose
#
# Three services:
#   cyclo_intelligence   main image (PLAN §4.5) — orchestrator +
#                         cyclo_data + UI + nginx + Policy Runtime. Always
#                         started first.
#   lerobot              policy container (PLAN §4.8) — pulled /
#                         started on demand by the UI via
#                         supervisor_api. May be brought up manually
#                         for Step 4 verification.
#
# Usage: prefer the container.sh wrapper — it auto-detects ARCH from
# `uname -m` and sets the compose env:
#   docker/container.sh start              # → cyclo_intelligence only
#   docker/container.sh start-lerobot      # → lerobot (no ROBOT_TYPE
#                                          #    needed; passed at LOAD)
#   docker/container.sh enter              # → bash inside cyclo_intelligence
#   docker/container.sh logs               # → compose logs -f
#   docker/container.sh stop               # → compose down
#
# Direct compose (ARCH defaults to arm64 since Jetson is the primary
# target):
#   docker compose -f docker/docker-compose.yml up -d --build cyclo_intelligence
#   docker compose -f docker/docker-compose.yml up -d --build lerobot

# Explicit project name. Without this, compose defaults the project to
# the parent dir name ('docker') — same default used by every other
# repo whose compose file sits under <repo>/docker/, including
# other ROBOTIS container suites (zenoh_daemon, ai_worker,
# novnc-server, talos_ui). Sharing the project name means compose
# treats those containers as 'orphans' of our project and
# --remove-orphans wipes them. Pin our own name so down/up only ever
# touches cyclo_intelligence's own containers.
name: cyclo_intelligence

services:
  # ============================================================
  # cyclo_intelligence main container (PLAN §4.5).
  # Multi-stage image (docker/Dockerfile.{arm64,amd64}) carries the
  # UI static assets, the ROS2 workspace (orchestrator + cyclo_data
  # + interfaces + shared), nginx, rosbridge, web_video_server, and
  # the s6-agent / supervisor_api control plane.
  # ============================================================
  cyclo_intelligence:
    container_name: cyclo_intelligence
    image: robotis/cyclo-intelligence:1.3.1
    build:
      context: ..
      dockerfile: docker/Dockerfile.${ARCH:-arm64}
      # Tegra (Jetson) 5.15.x kernels ship without iptable_raw, so
      # BuildKit can't create the per-step bridge network. host net
      # during build is functionally identical for our needs and skips
      # the iptables raw-table requirement entirely.
      network: host

    # SYS_NICE + rtprio so orchestrator's control thread can request
    # real-time priority. memlock matches the production runtime value.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856

    # Host network + IPC so rmw_zenoh on the orchestrator side can
    # reach the policy containers and the externally managed Zenoh router.
    network_mode: host
    ipc: host

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - CYCLO_UI_PORT=${CYCLO_UI_PORT:-7080}
      - CYCLO_ROSBRIDGE_PORT=${CYCLO_ROSBRIDGE_PORT:-7090}
      - CYCLO_VIDEO_SERVER_PORT=${CYCLO_VIDEO_SERVER_PORT:-7082}
      - CYCLO_WEB_VIDEO_SERVER_PORT=${CYCLO_WEB_VIDEO_SERVER_PORT:-7085}
      - CYCLO_SUPERVISOR_API_PORT=${CYCLO_SUPERVISOR_API_PORT:-7100}
      - CYCLO_POLICY_ROOT=/opt/cyclo/policy
      - CYCLO_SUPERVISOR_API_COMPOSE_FILE=/opt/cyclo/docker/docker-compose.yml
      # LOAD may include first-time gated backbone downloads (e.g. Cosmos).
      # Keep this long enough that a real download is not surfaced as a
      # false model-load failure while the container continues downloading.
      - INFERENCE_LOAD_TIMEOUT_SEC=${INFERENCE_LOAD_TIMEOUT_SEC:-7200}
      - LOAD_POLICY_TIMEOUT_S=${LOAD_POLICY_TIMEOUT_S:-7200}
      - CMD_VEL_LINEAR_DEADBAND=0.02
      - CMD_VEL_ANGULAR_DEADBAND=0.02
      - PYTHONUNBUFFERED=1

    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ./workspace:/workspace
      - ./huggingface:/root/.cache/huggingface
      - ./zenoh_cache:/root/.cache/zenoh_ros2_sdk:rw
      # Model dropboxes live under /workspace/model/{lerobot,groot}.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # supervisor_api manages lerobot / groot lifecycle via Docker SDK
      # (PLAN §4.8). Socket mount makes that possible without DinD.
      - /var/run/docker.sock:/var/run/docker.sock
      # s6-agent UDS — cyclo_manager FastAPI listens here for
      # system-wide control requests from the host side.
      - ${CYCLO_AGENT_SOCKETS_DIR:-/var/run/robotis/agent_sockets/cyclo_intelligence}:/var/run/agent
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    privileged: true
    restart: unless-stopped
    runtime: nvidia
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "S6_SVSTAT=$$(ls /package/admin/s6-*/command/s6-svstat 2>/dev/null | head -1); [ -n \"$$S6_SVSTAT\" ] && \"$$S6_SVSTAT\" /run/service/nginx | grep -q up && \"$$S6_SVSTAT\" /run/service/supervisor_api | grep -q up && \"$$S6_SVSTAT\" /run/service/s6-agent | grep -q up && \"$$S6_SVSTAT\" /run/service/policy-runtime | grep -q up && test -s /run/cyclo/policy-runtime.ready",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  # ============================================================
  # LeRobot Engine-only policy worker.
  # Not in depends_on — PLAN §4.8 says lerobot is pulled/started
  # on demand.
  # ============================================================
  lerobot:
    container_name: lerobot_server
    image: robotis/lerobot-zenoh:1.4.1-${ARCH:-arm64}
    build:
      context: ..
      dockerfile: cyclo_brain/policy/lerobot/Dockerfile.${ARCH:-arm64}
      # See cyclo_intelligence.build.network for why.
      network: host
      args:
        GPU_ARCH: ${GPU_ARCH:-default}

    # Share host network + IPC so rmw_zenoh can reach the central Runtime and
    # robot topics on the same host. /dev/shm enables Zenoh shared memory.
    network_mode: host
    ipc: host

    # The Worker owns model observation and inference only. Robot commands are
    # published by the Policy Runtime in cyclo_intelligence.
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONUNBUFFERED=1

    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ./workspace:/workspace
      # User-visible LeRobot models live under /workspace/model/lerobot.
      - ./huggingface:/root/.cache/huggingface
      # zenoh_ros2_sdk message-definition cache. Host-managed (see
      # docker/scripts/init_zenoh_cache.sh) so the in-container SDK
      # doesn't have to git-fetch the upstream `master` branch (gone)
      # and so docker-cp ownership games go away. All runtime containers share
      # one cache.
      - ./zenoh_cache:/root/.cache/zenoh_ros2_sdk:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # Policy containers are started on demand by the UI/supervisor API.
    # Do not auto-start them on host boot.
    restart: "no"
    runtime: nvidia
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "S6_SVSTAT=$$(ls /package/admin/s6-*/command/s6-svstat 2>/dev/null | head -1); [ -n \"$$S6_SVSTAT\" ] && \"$$S6_SVSTAT\" /run/service/engine-process | grep -q '^up ' && test -s /run/cyclo/engine-process.ready",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  # ============================================================
  # GR00T N1.7 Engine-only policy worker.
  # Pulled / started on demand by the UI
  # via supervisor_api (PLAN §4.8).
  # ============================================================
  groot:
    container_name: groot_server
    image: robotis/groot-zenoh:1.3.5-${ARCH:-arm64}
    build:
      context: ..
      dockerfile: cyclo_brain/policy/groot/Dockerfile.${ARCH:-arm64}
      # See cyclo_intelligence.build.network for why.
      network: host
      args:
        GPU_ARCH: ${GPU_ARCH:-default}
        FLASH_ATTN_BUILD_JOBS: ${FLASH_ATTN_BUILD_JOBS:-1}
        FLASH_ATTN_NVCC_THREADS: ${FLASH_ATTN_NVCC_THREADS:-1}
        FLASH_ATTN_CUDA_ARCHS: ${FLASH_ATTN_CUDA_ARCHS:-120}

    # Share host network + IPC so rmw_zenoh can reach the central Runtime and
    # robot topics on the same host. /dev/shm enables Zenoh shared memory.
    network_mode: host
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONUNBUFFERED=1

    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ./workspace:/workspace
      - ./huggingface:/root/.cache/huggingface
      # User-visible GR00T models live under /workspace/model/groot.
      # zenoh_ros2_sdk message-definition cache. Host-managed (see
      # docker/scripts/init_zenoh_cache.sh) so the in-container SDK
      # doesn't have to git-fetch the upstream `master` branch (gone)
      # and so docker-cp ownership games go away. Two containers share
      # one cache.
      - ./zenoh_cache:/root/.cache/zenoh_ros2_sdk:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # Policy containers are started on demand by the UI/supervisor API.
    # Do not auto-start them on host boot.
    restart: "no"
    runtime: nvidia
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "S6_SVSTAT=$$(ls /package/admin/s6-*/command/s6-svstat 2>/dev/null | head -1); [ -n \"$$S6_SVSTAT\" ] && \"$$S6_SVSTAT\" /run/service/engine-process | grep -q '^up ' && test -s /run/cyclo/engine-process.ready",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
